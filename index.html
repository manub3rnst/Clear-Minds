<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | MenteBem</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="container">

    <div class="left">

        <h1>MenteBem</h1>

        <h2>Crie sua conta</h2>

        <p id="descricao">

            Escolha seu perfil e preencha os dados para começar.

        </p>

    </div>

    <div class="right">

        <h2>Cadastro</h2>

        <!-- PERFIL -->

        <div class="perfil">

            <div class="card ativo" id="btnPaciente">

                <i class="fa-solid fa-user-graduate"></i>

                <h3>Paciente</h3>

                <p>Acompanhe sua saúde mental.</p>

            </div>

            <div class="card" id="btnPsicologo">

                <i class="fa-solid fa-brain"></i>

                <h3>Psicólogo</h3>

                <p>Acesse seu painel profissional.</p>

            </div>

        </div>

        <form>

            <div class="campo">

                <label>Nome completo</label>

                <input type="text" required>

            </div>

            <div id="pacienteCampos">

                <div class="campo">

                    <label>Data de nascimento</label>

                    <input type="date">

                </div>

                <div class="campo">

                    <label>Instituição</label>

                    <input type="text">

                </div>

                <div class="campo">

                    <label>Curso</label>

                    <input type="text">

                </div>

            </div>

            <div id="psicologoCampos" style="display:none;">

                <div class="campo">

                    <label>CRP</label>

                    <input type="text">

                </div>

            </div>

            <div class="campo">

                <label>E-mail</label>

                <input type="email" required>

            </div>

            <div class="campo">

                <label>Senha</label>

                <input type="password" required>

            </div>

            <div class="campo">

                <label>Confirmar senha</label>

                <input type="password" required>

            </div>

            <div class="checkbox">

                <input type="checkbox" required>

                <span>Aceito os Termos de Uso</span>

            </div>

            <button type="submit">

                Criar conta

            </button>

        </form>

        <p class="login">

            Já possui uma conta?

            <a href="index.html">Entrar</a>

        </p>

    </div>

</div>

<script src="js/cadastro.js"></script>

</body>

</html>
